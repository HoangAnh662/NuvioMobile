name: Check Stable 1.0.0 + Liquid Glass

on:
  push:
    branches:
      - stable-1.0.0-liquid-glass-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Liquid Glass branch
        uses: actions/checkout@v4
        with:
          ref: stable-1.0.0-liquid-glass-integration
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch official Stable 1.0.0
        run: |
          git remote add upstream https://github.com/NuvioMedia/NuvioMobile.git
          git fetch --no-tags upstream refs/tags/1.0.0
          git rev-parse FETCH_HEAD
          git log -1 --oneline FETCH_HEAD

      - name: Dry-run merge and report conflicts
        id: merge
        shell: bash
        run: |
          set +e
          git merge --no-commit --no-ff FETCH_HEAD
          MERGE_EXIT=$?
          if [ "$MERGE_EXIT" -ne 0 ]; then
            git diff --name-only --diff-filter=U > conflict-files.txt
            {
              echo "## Stable 1.0.0 merge check"
              echo ""
              echo "Merge could not be applied cleanly. No source changes were pushed."
              echo ""
              echo "### Conflicting files"
              if [ -s conflict-files.txt ]; then
                cat conflict-files.txt
              else
                echo "Git reported a merge failure without standard conflict markers."
              fi
            } > integration-report.md
            echo "clean=false" >> "$GITHUB_OUTPUT"
          else
            {
              echo "## Stable 1.0.0 merge check"
              echo ""
              echo "The upstream tag merged into the Liquid Glass branch in the temporary runner."
              echo "No merge commit or source changes were pushed to GitHub."
              echo ""
              echo "### Change summary"
              git diff --stat HEAD
            } > integration-report.md
            echo "clean=true" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload merge report
        uses: actions/upload-artifact@v4
        with:
          name: stable-1.0.0-liquid-glass-merge-report
          path: |
            integration-report.md
            conflict-files.txt
          if-no-files-found: ignore

      - name: Restore release signing key
        if: steps.merge.outputs.clean == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_STORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing NUVIO_RELEASE_STORE_BASE64 secret"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > nuvio-beta055-release.jks

      - name: Configure Android build properties
        if: steps.merge.outputs.clean == 'true'
        env:
          API_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::error::Missing NUVIO_SUPABASE_ANON_KEY secret"
            exit 1
          fi
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          printf 'NUVIO_SUPABASE_URL=https://api.nuvio.tv\n' >> local.properties
          printf 'NUVIO_SUPABASE_ANON_KEY=%s\n' "$API_KEY" >> local.properties
          printf 'NUVIO_RELEASE_STORE_FILE=nuvio-beta055-release.jks\n' >> local.properties
          printf 'NUVIO_RELEASE_STORE_PASSWORD=%s\n' "$STORE_PASSWORD" >> local.properties
          printf 'NUVIO_RELEASE_KEY_ALIAS=%s\n' "$KEY_ALIAS" >> local.properties
          printf 'NUVIO_RELEASE_KEY_PASSWORD=%s\n' "$KEY_PASSWORD" >> local.properties

      - name: Build merged ARM64 release APK
        if: steps.merge.outputs.clean == 'true'
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleFullRelease -PreleaseMinifyEnabled=true --stacktrace

      - name: Collect ARM64 APK
        if: steps.merge.outputs.clean == 'true'
        run: |
          mkdir -p artifact
          APK=$(find androidApp/build/outputs/apk -type f -name '*.apk' | grep 'arm64-v8a' | grep -i release | head -n 1)
          test -n "$APK"
          cp "$APK" artifact/Nuvio-Stable-1.0.0-Liquid-Glass-arm64.apk

      - name: Upload test APK
        if: steps.merge.outputs.clean == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-Stable-1.0.0-Liquid-Glass-arm64
          path: artifact/Nuvio-Stable-1.0.0-Liquid-Glass-arm64.apk
          if-no-files-found: error
