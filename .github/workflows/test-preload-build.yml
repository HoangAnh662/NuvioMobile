name: Test Preload Android Build
on:
  push:
    branches:
      - test/preload-058-selective
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_STORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo '::error::Missing release keystore'; exit 1; fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > nuvio-beta055-release.jks
      - name: Configure login and runtime services
        env:
          STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
          SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing NUVIO_SUPABASE_ANON_KEY GitHub secret"
            exit 1
          fi
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          printf 'NUVIO_SUPABASE_URL=https://api.nuvio.tv\n' >> local.properties
          printf 'NUVIO_SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY" >> local.properties
          printf 'NUVIO_RELEASE_STORE_FILE=nuvio-beta055-release.jks\n' >> local.properties
          printf 'NUVIO_RELEASE_STORE_PASSWORD=%s\n' "$STORE_PASSWORD" >> local.properties
          printf 'NUVIO_RELEASE_KEY_ALIAS=%s\n' "$KEY_ALIAS" >> local.properties
          printf 'NUVIO_RELEASE_KEY_PASSWORD=%s\n' "$KEY_PASSWORD" >> local.properties
      - name: Build optimized release APK
        run: ./gradlew :androidApp:assembleFullRelease -Pnuvio.preload.test=true -PreleaseMinifyEnabled=true --stacktrace
      - name: Collect ARM64 APK
        run: |
          mkdir -p artifact
          APK=$(find androidApp/build/outputs/apk -type f -name '*.apk' | grep 'arm64-v8a' | grep -i release | head -n 1)
          test -n "$APK"
          cp "$APK" artifact/Nuvio-Preload-Test-arm64-release.apk
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-preload-test-arm64-release
          path: artifact/Nuvio-Preload-Test-arm64-release.apk
          if-no-files-found: error
