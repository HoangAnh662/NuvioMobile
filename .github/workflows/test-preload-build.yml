name: Test Preload Android Build
on:
  push:
    branches:
      - test/preload-058-selective
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build full debug APK
        run: ./gradlew :androidApp:assembleFullDebug --stacktrace
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-preload-test-debug-apk
          path: androidApp/build/outputs/apk/**/*.apk
          if-no-files-found: error
