name: Test Preload Android Build
on:
  push:
    branches:
      - test/preload-058-selective
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure login and runtime services
        env:
          SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing NUVIO_SUPABASE_ANON_KEY GitHub secret"
            exit 1
          fi
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          printf 'NUVIO_SUPABASE_URL=https://api.nuvio.tv\n' >> local.properties
          printf 'NUVIO_SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY" >> local.properties
      - name: Build full debug APK
        run: ./gradlew :androidApp:assembleFullDebug --stacktrace
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-preload-test-debug-apk
          path: androidApp/build/outputs/apk/**/*.apk
          if-no-files-found: error
