name: Build Nuvio 0.5.5 Parallel APK

on:
  workflow_dispatch:
  push:
    branches:
      - nuvio-055-parallel

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare local properties
        run: |
          touch local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build parallel debug APK
        run: ./gradlew :androidApp:assembleFullDebug

      - name: Collect APK
        shell: bash
        run: |
          set -e
          mkdir -p artifact
          APK=$(find androidApp/build/outputs/apk -type f -name '*debug*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" artifact/Nuvio-0.5.5-Beta-Parallel-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-0.5.5-Beta-Parallel-arm64
          path: artifact/Nuvio-0.5.5-Beta-Parallel-arm64.apk
          if-no-files-found: error
