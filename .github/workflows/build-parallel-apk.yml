name: Build Nuvio 0.5.5 Parallel Release

on:
  workflow_dispatch:
  push:
    branches:
      - nuvio-055-parallel

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_STORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > nuvio-beta055-release.jks

      - name: Prepare local.properties
        env:
          API_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "NUVIO_SUPABASE_URL=https://api.nuvio.tv" >> local.properties
          echo "NUVIO_SUPABASE_ANON_KEY=$API_KEY" >> local.properties
          echo "NUVIO_RELEASE_STORE_FILE=nuvio-beta055-release.jks" >> local.properties
          echo "NUVIO_RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> local.properties
          echo "NUVIO_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> local.properties
          echo "NUVIO_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> local.properties

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Apply iOS-style glass navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('composeApp/src/commonMain/kotlin/com/nuvio/app/core/ui/NavigationBar.kt')
          s = p.read_text()
          s = s.replace('import androidx.compose.foundation.background\n', 'import androidx.compose.foundation.background\nimport androidx.compose.foundation.border\n')
          s = s.replace('blurRadius = 24.dp', 'blurRadius = 34.dp')
          old = '.background(Color(0xFF1C1C1E).copy(alpha = if (hazeState != null) 0.55f else 0.82f))'
          new = '.background(Color(0xFF1C1C1E).copy(alpha = if (hazeState != null) 0.30f else 0.68f))\n            .border(1.dp, Color.White.copy(alpha = 0.16f), RoundedCornerShape(NuvioTokens.Radius.full))'
          if old not in s: raise SystemExit('Navigation pill background pattern not found')
          s = s.replace(old, new, 1)
          s = s.replace('tokens.colors.accent.copy(alpha = NuvioTokens.Opacity.selected)', 'Color.White.copy(alpha = 0.14f)')
          p.write_text(s)
          PY

      - name: Apply glossy Liquid Glass player UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('composeApp/src/commonMain/kotlin/com/nuvio/app/features/player/PlayerControls.kt')
          s = p.read_text()
          s = s.replace('import androidx.compose.foundation.clickable\n', 'import androidx.compose.foundation.clickable\nimport androidx.compose.foundation.interaction.collectIsPressedAsState\nimport androidx.compose.foundation.interaction.MutableInteractionSource\n')
          s = s.replace('import androidx.compose.ui.graphics.Brush\n', 'import androidx.compose.ui.graphics.Brush\nimport androidx.compose.ui.geometry.Offset\n')

          old = '''    Box(
        modifier = Modifier
            .clip(CircleShape)
            .clickable(onClick = onClick)
            .padding(metrics.sideButtonPadding),
        contentAlignment = Alignment.Center,
    ) {'''
          new = '''    val interactionSource = remember { MutableInteractionSource() }
    val pressed by interactionSource.collectIsPressedAsState()
    val scale by animateFloatAsState(if (pressed) 0.90f else 1f, tween(110), label = "sideGlassScale")
    Box(
        modifier = Modifier
            .size(metrics.playIconSize + metrics.sideButtonPadding * 1.45f)
            .graphicsLayer { scaleX = scale; scaleY = scale }
            .clip(CircleShape)
            .background(
                Brush.linearGradient(
                    colors = if (pressed) listOf(Color.White.copy(alpha = 0.48f), Color.White.copy(alpha = 0.20f), Color.Black.copy(alpha = 0.18f)) else listOf(Color.White.copy(alpha = 0.30f), Color.White.copy(alpha = 0.09f), Color.Black.copy(alpha = 0.20f)),
                    start = Offset.Zero,
                    end = Offset.Infinite,
                ),
            )
            .border(if (pressed) 2.dp else 1.35.dp, Color.White.copy(alpha = if (pressed) 0.98f else 0.72f), CircleShape)
            .clickable(interactionSource = interactionSource, indication = null, onClick = onClick),
        contentAlignment = Alignment.Center,
    ) {
        Box(
            Modifier
                .align(Alignment.TopCenter)
                .padding(top = 3.dp)
                .size(width = metrics.playIconSize * 0.72f, height = 3.dp)
                .clip(CircleShape)
                .background(Color.White.copy(alpha = if (pressed) 0.78f else 0.48f)),
        )'''
          if old not in s: raise SystemExit('SideControlButton pattern not found')
          s = s.replace(old, new, 1)

          old = '''    Box(
        modifier = Modifier
            .clip(CircleShape)
            .clickable(onClick = onClick)
            .padding(metrics.playButtonPadding),
        contentAlignment = Alignment.Center,
    ) {'''
          new = '''    val interactionSource = remember { MutableInteractionSource() }
    val pressed by interactionSource.collectIsPressedAsState()
    val scale by animateFloatAsState(if (pressed) 0.90f else 1f, tween(110), label = "playGlassScale")
    Box(
        modifier = Modifier
            .size(metrics.playIconSize + metrics.playButtonPadding * 1.55f)
            .graphicsLayer { scaleX = scale; scaleY = scale }
            .clip(CircleShape)
            .background(
                Brush.linearGradient(
                    colors = if (pressed) listOf(Color.White.copy(alpha = 0.56f), Color.White.copy(alpha = 0.24f), Color.Black.copy(alpha = 0.16f)) else listOf(Color.White.copy(alpha = 0.36f), Color.White.copy(alpha = 0.12f), Color.Black.copy(alpha = 0.18f)),
                    start = Offset.Zero,
                    end = Offset.Infinite,
                ),
            )
            .border(if (pressed) 2.2.dp else 1.5.dp, Color.White.copy(alpha = if (pressed) 1f else 0.82f), CircleShape)
            .clickable(interactionSource = interactionSource, indication = null, onClick = onClick),
        contentAlignment = Alignment.Center,
    ) {
        Box(
            Modifier
                .align(Alignment.TopCenter)
                .padding(top = 3.dp)
                .size(width = metrics.playIconSize * 0.82f, height = 3.dp)
                .clip(CircleShape)
                .background(Color.White.copy(alpha = if (pressed) 0.86f else 0.56f)),
        )'''
          if old not in s: raise SystemExit('PlayPauseControlButton pattern not found')
          s = s.replace(old, new, 1)
          s = s.replace('.background(Color.Black.copy(alpha = 0.35f))\n            .clickable(onClick = onClick)', '.background(Brush.linearGradient(listOf(Color.White.copy(alpha = 0.30f), Color.White.copy(alpha = 0.08f), Color.Black.copy(alpha = 0.20f))))\n            .border(1.35.dp, Color.White.copy(alpha = 0.72f), CircleShape)\n            .clickable(onClick = onClick)', 1)
          p.write_text(s)

          p = Path('composeApp/src/commonMain/kotlin/com/nuvio/app/features/player/PlayerControlActions.kt')
          s = p.read_text()
          s = s.replace('import androidx.compose.foundation.clickable\n', 'import androidx.compose.foundation.background\nimport androidx.compose.foundation.border\nimport androidx.compose.foundation.clickable\nimport androidx.compose.foundation.interaction.collectIsPressedAsState\nimport androidx.compose.foundation.interaction.MutableInteractionSource\n')
          s = s.replace('import androidx.compose.foundation.rememberScrollState\n', 'import androidx.compose.foundation.rememberScrollState\nimport androidx.compose.foundation.shape.CircleShape\nimport androidx.compose.foundation.shape.RoundedCornerShape\n')
          s = s.replace('import androidx.compose.ui.graphics.Color\n', 'import androidx.compose.ui.draw.clip\nimport androidx.compose.ui.graphics.Brush\nimport androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.graphics.graphicsLayer\n')
          s = s.replace('import androidx.compose.runtime.setValue\n', 'import androidx.compose.runtime.setValue\nimport androidx.compose.animation.core.animateFloatAsState\nimport androidx.compose.animation.core.tween\n')
          s = s.replace('containerColor = Color.Transparent,', 'containerColor = Color.White.copy(alpha = 0.14f),')
          old = '''    IconButton(onClick = onClick, modifier = Modifier.size(48.dp)) {
        if (painter != null) {'''
          new = '''    val interactionSource = remember { MutableInteractionSource() }
    val pressed by interactionSource.collectIsPressedAsState()
    val scale by animateFloatAsState(if (pressed) 0.88f else 1f, tween(100), label = "actionGlassScale")
    IconButton(
        onClick = onClick,
        interactionSource = interactionSource,
        modifier = Modifier
            .size(44.dp)
            .graphicsLayer { scaleX = scale; scaleY = scale }
            .clip(CircleShape)
            .background(Brush.linearGradient(if (pressed) listOf(Color.White.copy(alpha = 0.50f), Color.White.copy(alpha = 0.18f), Color.Black.copy(alpha = 0.18f)) else listOf(Color.White.copy(alpha = 0.28f), Color.White.copy(alpha = 0.07f), Color.Black.copy(alpha = 0.20f))))
            .border(if (pressed) 2.dp else 1.3.dp, Color.White.copy(alpha = if (pressed) 0.98f else 0.70f), CircleShape),
    ) {
        if (painter != null) {'''
          if old not in s: raise SystemExit('PlayerAction pattern not found')
          s = s.replace(old, new, 1)
          old = 'modifier = Modifier.height(48.dp).widthIn(min = 48.dp).clickable('
          new = 'modifier = Modifier.height(44.dp).widthIn(min = 48.dp).clip(RoundedCornerShape(22.dp)).background(Brush.linearGradient(listOf(Color.White.copy(alpha = 0.25f), Color.White.copy(alpha = 0.06f), Color.Black.copy(alpha = 0.20f)))).border(1.3.dp, Color.White.copy(alpha = 0.66f), RoundedCornerShape(22.dp)).padding(horizontal = 14.dp).clickable('
          if old not in s: raise SystemExit('Runtime pill pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('composeApp/src/commonMain/kotlin/com/nuvio/app/features/player/PlayerTimeline.kt')
          s = p.read_text()
          s = s.replace('import androidx.compose.foundation.layout.Box\n', 'import androidx.compose.foundation.background\nimport androidx.compose.foundation.border\nimport androidx.compose.foundation.layout.Box\n')
          s = s.replace('import androidx.compose.foundation.layout.padding\n', 'import androidx.compose.foundation.layout.padding\nimport androidx.compose.foundation.layout.size\n')
          s = s.replace('import androidx.compose.ui.Modifier\n', 'import androidx.compose.ui.Modifier\nimport androidx.compose.foundation.shape.CircleShape\nimport androidx.compose.ui.draw.clip\n')
          s = s.replace('thumb = {},', 'thumb = { Box(Modifier.size(if (isInteracting) 20.dp else 14.dp).clip(CircleShape).background(Color.White.copy(alpha = if (isInteracting) 0.96f else 0.78f)).border(if (isInteracting) 2.dp else 1.25.dp, Color.White.copy(alpha = 1f), CircleShape)) },')
          s = s.replace('color = Color.White.copy(alpha = 0.3f),', 'color = Color.White.copy(alpha = 0.16f),', 1)
          s = s.replace('color = accent.copy(alpha = 0.35f),', 'color = Color.White.copy(alpha = 0.28f),', 1)
          old = 'brush = accentBrush,'
          if old not in s: raise SystemExit('Timeline active track pattern not found')
          s = s.replace(old, 'color = Color.White.copy(alpha = 0.98f),', 1)
          p.write_text(s)
          PY

      - name: Compact episode and stream panels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('composeApp/src/commonMain/kotlin/com/nuvio/app/features/player/PlayerEpisodesPanel.kt')
          s = p.read_text()
          needle = '        onDismiss = onDismiss,\n        modifier = modifier,\n'
          if needle not in s: raise SystemExit('Episode side panel args not found')
          s = s.replace(needle, '        onDismiss = onDismiss,\n        width = 460.dp,\n        modifier = modifier,\n', 1)
          s = s.replace('verticalArrangement = Arrangement.spacedBy(12.dp),\n                contentPadding = PaddingValues(top = 4.dp, bottom = 8.dp),', 'verticalArrangement = Arrangement.spacedBy(8.dp),\n                contentPadding = PaddingValues(top = 2.dp, bottom = 6.dp),', 1)
          s = s.replace('.padding(10.dp),\n        verticalAlignment = Alignment.Top,\n        horizontalArrangement = Arrangement.spacedBy(14.dp),', '.padding(8.dp),\n        verticalAlignment = Alignment.CenterVertically,\n        horizontalArrangement = Arrangement.spacedBy(10.dp),', 1)
          s = s.replace('.width(130.dp)\n                .height(90.dp)', '.width(112.dp)\n                .height(72.dp)', 1)
          s = s.replace('.padding(8.dp)\n                        .clip(RoundedCornerShape(6.dp))', '.padding(6.dp)\n                        .clip(RoundedCornerShape(6.dp))', 1)
          s = s.replace('.padding(horizontal = 8.dp, vertical = 4.dp),', '.padding(horizontal = 7.dp, vertical = 3.dp),', 1)
          p.write_text(s)
          PY

      - name: Build Full Release
        run: ./gradlew :androidApp:assembleFullRelease -PreleaseMinifyEnabled=true

      - name: Collect ARM64 APK
        run: |
          mkdir -p artifact
          APK=$(find androidApp/build/outputs/apk \
            -type f \
            -name "*.apk" |
            grep "arm64-v8a" |
            grep -i "release" |
            head -n 1)
          echo "ARM64 APK: $APK"
          test -n "$APK"
          cp "$APK" artifact/Nuvio-0.5.5-Beta-Parallel-arm64-release.apk

      - name: Upload ARM64 Release
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-0.5.5-Beta-Parallel-arm64-release
          path: artifact/Nuvio-0.5.5-Beta-Parallel-arm64-release.apk
          if-no-files-found: error
