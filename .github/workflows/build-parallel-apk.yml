name: Build Nuvio 0.5.5 Parallel Release

on:
  workflow_dispatch:
  push:
    branches: [nuvio-055-parallel]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_STORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > nuvio-beta055-release.jks
      - name: Prepare local.properties
        env:
          API_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "NUVIO_SUPABASE_URL=https://api.nuvio.tv" >> local.properties
          echo "NUVIO_SUPABASE_ANON_KEY=$API_KEY" >> local.properties
          echo "NUVIO_RELEASE_STORE_FILE=nuvio-beta055-release.jks" >> local.properties
          echo "NUVIO_RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> local.properties
          echo "NUVIO_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> local.properties
          echo "NUVIO_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> local.properties
      - run: chmod +x gradlew
      - name: Apply finalized Liquid Glass UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('composeApp/src/commonMain/kotlin/com/nuvio/app/core/ui/NavigationBar.kt'); s=p.read_text(); s=s.replace('import androidx.compose.foundation.background\n','import androidx.compose.foundation.background\nimport androidx.compose.foundation.border\n'); s=s.replace('blurRadius = 24.dp','blurRadius = 34.dp'); s=s.replace('.background(Color(0xFF1C1C1E).copy(alpha = if (hazeState != null) 0.55f else 0.82f))','.background(Color(0xFF1C1C1E).copy(alpha = if (hazeState != null) 0.30f else 0.68f))\n            .border(1.dp, Color.White.copy(alpha = 0.20f), RoundedCornerShape(NuvioTokens.Radius.full))',1); s=s.replace('tokens.colors.accent.copy(alpha = NuvioTokens.Opacity.selected)','Color.White.copy(alpha = 0.14f)'); p.write_text(s)

          p=Path('composeApp/src/commonMain/kotlin/com/nuvio/app/features/player/PlayerControls.kt'); s=p.read_text(); glass='Brush.verticalGradient(listOf(Color.White.copy(alpha = 0.38f), Color.White.copy(alpha = 0.10f), Color.Black.copy(alpha = 0.26f)))'; strong='Brush.verticalGradient(listOf(Color.White.copy(alpha = 0.48f), Color.White.copy(alpha = 0.14f), Color.Black.copy(alpha = 0.30f)))'; s=s.replace('.clip(CircleShape)\n            .background(Color.Black.copy(alpha = 0.35f))\n            .clickable(onClick = onClick)',f'.clip(CircleShape)\n            .background({glass})\n            .border(1.5.dp, Color.White.copy(alpha = 0.78f), CircleShape)\n            .clickable(onClick = onClick)'); s=s.replace('.clip(CircleShape)\n            .clickable(onClick = onClick)\n            .padding(metrics.sideButtonPadding)',f'.clip(CircleShape)\n            .background({glass})\n            .border(1.5.dp, Color.White.copy(alpha = 0.76f), CircleShape)\n            .clickable(onClick = onClick)\n            .padding(metrics.sideButtonPadding * 0.78f)'); s=s.replace('.clip(CircleShape)\n            .clickable(onClick = onClick)\n            .padding(metrics.playButtonPadding)',f'.clip(CircleShape)\n            .background({strong})\n            .border(1.8.dp, Color.White.copy(alpha = 0.90f), CircleShape)\n            .clickable(onClick = onClick)\n            .padding(metrics.playButtonPadding * 0.82f)'); p.write_text(s)

          p=Path('composeApp/src/commonMain/kotlin/com/nuvio/app/features/player/PlayerControlActions.kt'); s=p.read_text(); s=s.replace('import androidx.compose.foundation.clickable\n','import androidx.compose.foundation.background\nimport androidx.compose.foundation.border\nimport androidx.compose.foundation.clickable\n'); s=s.replace('import androidx.compose.foundation.rememberScrollState\n','import androidx.compose.foundation.rememberScrollState\nimport androidx.compose.foundation.shape.RoundedCornerShape\n'); s=s.replace('import androidx.compose.ui.Modifier\n','import androidx.compose.ui.Modifier\nimport androidx.compose.ui.draw.clip\n'); s=s.replace('import androidx.compose.ui.graphics.Color\n','import androidx.compose.ui.graphics.Brush\nimport androidx.compose.ui.graphics.Color\n'); old='modifier = Modifier.weight(1f).offset(x = startOffset).horizontalScroll(scrollState),'; new='modifier = Modifier.weight(1f).offset(x = startOffset).clip(RoundedCornerShape(24.dp)).background(Brush.verticalGradient(listOf(Color.White.copy(alpha = 0.28f), Color.White.copy(alpha = 0.08f), Color.Black.copy(alpha = 0.24f)))).border(1.2.dp, Color.White.copy(alpha = 0.55f), RoundedCornerShape(24.dp)).padding(horizontal = 6.dp).horizontalScroll(scrollState),'; s=s.replace(old,new,1); p.write_text(s)

          p=Path('composeApp/src/commonMain/kotlin/com/nuvio/app/features/player/PlayerTimeline.kt'); s=p.read_text(); s=s.replace('import androidx.compose.foundation.layout.Box\n','import androidx.compose.foundation.background\nimport androidx.compose.foundation.border\nimport androidx.compose.foundation.layout.Box\n'); s=s.replace('import androidx.compose.foundation.layout.padding\n','import androidx.compose.foundation.layout.padding\nimport androidx.compose.foundation.layout.size\n'); s=s.replace('import androidx.compose.ui.Modifier\n','import androidx.compose.ui.Modifier\nimport androidx.compose.foundation.shape.CircleShape\nimport androidx.compose.ui.draw.clip\n'); s=s.replace('thumb = {},','thumb = { Box(Modifier.size(if (isInteracting) 20.dp else 14.dp).clip(CircleShape).background(Color.White.copy(alpha = 0.88f)).border(1.5.dp, Color.White, CircleShape)) },'); s=s.replace('val trackOrigin = Offset(0f, 35.dp.toPx() - trackHeight / 2)','val trackOrigin = Offset(0f, size.height / 2f - trackHeight / 2f)',1); p.write_text(s)

          p=Path('composeApp/src/commonMain/kotlin/com/nuvio/app/features/player/PlayerEpisodesPanel.kt'); s=p.read_text(); needle='        onDismiss = onDismiss,\n        modifier = modifier,\n'; s=s.replace(needle,'        onDismiss = onDismiss,\n        width = 380.dp,\n        modifier = modifier,\n',1); s=s.replace('verticalArrangement = Arrangement.spacedBy(12.dp),\n                contentPadding = PaddingValues(top = 4.dp, bottom = 8.dp),','verticalArrangement = Arrangement.spacedBy(8.dp),\n                contentPadding = PaddingValues(top = 2.dp, bottom = 6.dp),',1); s=s.replace('.padding(10.dp),\n        verticalAlignment = Alignment.Top,\n        horizontalArrangement = Arrangement.spacedBy(14.dp),','.padding(8.dp),\n        verticalAlignment = Alignment.CenterVertically,\n        horizontalArrangement = Arrangement.spacedBy(10.dp),',1); s=s.replace('.width(130.dp)\n                .height(90.dp)','.width(96.dp)\n                .height(60.dp)',1); p.write_text(s)
          PY
      - name: Build Full Release
        run: ./gradlew :androidApp:assembleFullRelease -PreleaseMinifyEnabled=true
      - name: Collect ARM64 APK
        run: |
          mkdir -p artifact
          APK=$(find androidApp/build/outputs/apk -type f -name "*.apk" | grep "arm64-v8a" | grep -i "release" | head -n 1)
          test -n "$APK"
          cp "$APK" artifact/Nuvio-0.5.5-Beta-Parallel-arm64-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Nuvio-0.5.5-Beta-Parallel-arm64-release
          path: artifact/Nuvio-0.5.5-Beta-Parallel-arm64-release.apk
          if-no-files-found: error
