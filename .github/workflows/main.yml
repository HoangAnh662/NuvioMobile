name: Build Nuvio Test APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Init MPVKit submodule
        run: |
          git submodule update --init MPVKit || true

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Full Debug APK
        run: ./gradlew :androidApp:assembleFullDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Nuvio-Test-Full-Debug
          path: androidApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
